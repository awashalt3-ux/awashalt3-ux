name: Update stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-stats.mjs
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update stats [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected, rebasing on remote (attempt $i)..."
            git pull --rebase --autostash origin main
            if git diff --cached --quiet; then
              echo "Nothing left after rebase."
              exit 0
            fi
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
