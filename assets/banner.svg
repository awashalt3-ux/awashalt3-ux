<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Orpheus / Web — développeur web indépendant">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2ebd3" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c5f36b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c5f36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5f36b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c5f36b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e15"/>
      <stop offset="1" stop-color="#11140d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="#0d0f0b"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="1040" cy="60" r="340" fill="url(#glow)"/>
  <circle cx="1040" cy="55" r="215" fill="none" stroke="#c5f36b" stroke-opacity="0.13"/>
  <circle cx="1040" cy="55" r="285" fill="none" stroke="#c5f36b" stroke-opacity="0.06"/>
  <rect x="56" y="44" width="38" height="38" rx="11" fill="#15180f" stroke="#c5f36b" stroke-opacity="0.55"/>
  <text x="75" y="71" fill="#f0f1e9" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">o<tspan fill="#c5f36b">.</tspan></text>
  <text x="106" y="70" fill="#f0f1e9" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.3">orpheus<tspan fill="#c5f36b">/</tspan>web</text>
  <rect x="230" y="54" width="1" height="18" fill="#ffffff" fill-opacity="0.12"/>
  <text x="246" y="69" fill="#697064" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="10.5" letter-spacing="1.6">DÉVELOPPEUR WEB INDÉPENDANT</text>
  <text x="56" y="176" fill="#f0f1e9" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.6">Des interfaces</text>
  <text x="56" y="240" fill="#c5f36b" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.6">qui servent.</text>
  <text x="58" y="276" fill="#a2a99a" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15.5">Applications web, outils local-first et interfaces soignées.</text>
  <rect x="56" y="296" width="122" height="30" rx="15" fill="#1a1e15" stroke="#c5f36b" stroke-opacity="0.22"/>
  <text x="117" y="315" fill="#a2a99a" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="11" text-anchor="middle">local-first</text>
  <rect x="186" y="296" width="116" height="30" rx="15" fill="#1a1e15" stroke="#c5f36b" stroke-opacity="0.22"/>
  <text x="244" y="315" fill="#a2a99a" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="11" text-anchor="middle">open source</text>
  <rect x="310" y="296" width="116" height="30" rx="15" fill="#1a1e15" stroke="#c5f36b" stroke-opacity="0.22"/>
  <text x="368" y="315" fill="#a2a99a" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="11" text-anchor="middle">zero cloud</text>
  <g filter="url(#shadow)">
    <rect x="700" y="52" width="444" height="256" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>
  <line x1="700" y1="94" x2="1144" y2="94" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="726" cy="73" r="4" fill="#697064"/>
  <circle cx="742" cy="73" r="4" fill="#697064"/>
  <circle cx="758" cy="73" r="4" fill="#8ab43a"/>
  <text x="922" y="77" fill="#7c8576" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="10.5" text-anchor="middle">orpheus.ts</text>
  <circle cx="1088" cy="73" r="3" fill="#c5f36b"/>
  <text x="1098" y="77" fill="#c5f36b" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">OPEN</text>
  <g font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5">
    <text x="726" y="126" fill="#4b5346" font-size="11">1</text>
    <text x="750" y="126" fill="#a2a99a"><tspan fill="#c9a6ff">const</tspan> <tspan fill="#f0f1e9">orpheus</tspan> = {</text>
    <text x="726" y="152" fill="#4b5346" font-size="11">2</text>
    <text x="750" y="152" fill="#a2a99a">  role: <tspan fill="#c5f36b">"développeur web"</tspan>,</text>
    <text x="726" y="178" fill="#4b5346" font-size="11">3</text>
    <text x="750" y="178" fill="#a2a99a">  stack: [<tspan fill="#c5f36b">"ts"</tspan>, <tspan fill="#c5f36b">"react"</tspan>, <tspan fill="#c5f36b">"node"</tspan>],</text>
    <text x="726" y="204" fill="#4b5346" font-size="11">4</text>
    <text x="750" y="204" fill="#a2a99a">  focus: <tspan fill="#c5f36b">"local-first"</tspan>,</text>
    <text x="726" y="230" fill="#4b5346" font-size="11">5</text>
    <text x="750" y="230" fill="#a2a99a">  ship: () =&gt; <tspan fill="#c5f36b">"with care"</tspan>,</text>
    <text x="726" y="256" fill="#4b5346" font-size="11">6</text>
    <text x="750" y="256" fill="#a2a99a">};</text>
    <text x="726" y="282" fill="#4b5346" font-size="11">7</text>
    <rect x="750" y="270" width="7" height="15" fill="#c5f36b" opacity="0.75"/>
  </g>
  <text x="1144" y="340" fill="#5c6557" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="9.5" text-anchor="end" letter-spacing="0.8">awashalt3-ux.github.io/portfolio →</text>
  <line x1="56" y1="332" x2="420" y2="332" stroke="url(#line)" stroke-width="1.2"/>
